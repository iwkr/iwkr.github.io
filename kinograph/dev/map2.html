<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Von</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: flex;
      background: #080808;
      width: 100vw; height: 100vh;
      overflow: hidden;
      font-family: monospace;
      color: #ccc;
    }

    /* ── Map ── */
    #map-wrap { flex: 1; overflow: hidden; }
    #map { display: block; width: 100%; height: 100%; cursor: grab; }
    #map.panning { cursor: grabbing; }

    /* ── Sidebar ── */
    #sidebar {
      width: 272px; flex-shrink: 0;
      border-left: 1px solid #161616;
      display: flex; flex-direction: column;
    }

    #sidebar-head {
      padding: 16px 16px 13px;
      border-bottom: 1px solid #161616;
      flex-shrink: 0;
    }
    #head-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    #head-row h2 { font-size: 10px; letter-spacing: 0.14em; color: #333; }
    #btn-reset {
      font: 10px/1 monospace; letter-spacing: 0.05em;
      background: none; border: 1px solid #1e1e1e; color: #282828;
      padding: 3px 8px; border-radius: 3px; cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    #btn-reset:hover { color: #888; border-color: #444; }
    #prog-track { height: 2px; background: #161616; border-radius: 2px; }
    #prog-fill  { height: 100%; width: 0; background: #3e3e3e; border-radius: 2px; transition: width 0.5s; }
    #prog-text  { font-size: 11px; color: #2a2a2a; margin-top: 7px; }

    /* ── Panel ── */
    #panel {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column;
    }
    #panel::-webkit-scrollbar { width: 3px; }
    #panel::-webkit-scrollbar-thumb { background: #181818; border-radius: 2px; }

    #panel-empty {
      flex: 1; display: flex; align-items: center; justify-content: center;
      font-size: 11px; color: #222; letter-spacing: 0.06em;
      text-align: center; padding: 20px;
    }

    #panel-content { padding: 20px 18px 28px; display: none; flex-direction: column; gap: 0; }

    #panel-img-wrap {
      width: 100px; height: 100px;
      border-radius: 50%; overflow: hidden;
      margin: 0 auto 16px;
      flex-shrink: 0;
    }
    #panel-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    #panel-img.mastered { filter: grayscale(1) brightness(0.45); }

    #panel-name {
      font-size: 14px; font-weight: bold; letter-spacing: 0.05em;
      text-align: center; margin-bottom: 5px;
    }
    #panel-meta {
      font-size: 10px; letter-spacing: 0.08em; color: #333;
      text-align: center; margin-bottom: 20px;
    }
    #panel-meta span { margin: 0 4px; }
    .status-unlocked { color: #4a8; }
    .status-mastered { color: #333; }

    .panel-section {
      font-size: 10px; letter-spacing: 0.1em; color: #2a2a2a;
      margin-bottom: 8px; margin-top: 16px;
    }
    .panel-section:first-of-type { margin-top: 0; }

    .panel-node-row {
      display: flex; align-items: center; gap: 9px;
      padding: 5px 0;
    }
    .panel-thumb {
      width: 30px; height: 30px;
      border-radius: 50%; flex-shrink: 0; object-fit: cover;
    }
    .panel-thumb.mastered { filter: grayscale(1) brightness(0.45); }
    .panel-thumb.locked   { filter: grayscale(1) brightness(0.2); }

    .panel-node-name {
      font-size: 11px; letter-spacing: 0.03em;
      flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .panel-node-status { font-size: 11px; color: #2a2a2a; flex-shrink: 0; }

    #panel-master-btn {
      margin-top: 22px;
      width: 100%; padding: 10px;
      font: 11px/1 monospace; letter-spacing: 0.1em;
      background: none; border: 1px solid #222; color: #555;
      border-radius: 4px; cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    #panel-master-btn:hover { color: #ddd; border-color: #666; }

    /* ── Tooltip ── */
    #tooltip {
      position: fixed; z-index: 9;
      background: rgba(8,8,8,0.95);
      border: 1px solid #1e1e1e;
      color: #888; padding: 8px 12px;
      border-radius: 5px; font-size: 11px; line-height: 1.6;
      pointer-events: none; opacity: 0; transition: opacity 0.1s;
      white-space: nowrap;
    }
    #tooltip.on { opacity: 1; }

    /* ── Node animations ── */
    .node-inner { transition: filter 0.35s; }
    @keyframes pop-in {
      from { transform: scale(0.4); opacity: 0; }
      65%  { transform: scale(1.1); }
      to   { transform: scale(1);   opacity: 1; }
    }
    .node-inner.popping { animation: pop-in 0.4s cubic-bezier(.22,1,.36,1) both; }

    /* selection ring applied via JS setAttribute, not CSS */
  </style>
</head>
<body>

<div id="map-wrap">
  <svg id="map"><g id="world"></g></svg>
</div>
<div id="sidebar">
  <div id="sidebar-head">
    <div id="head-row">
      <h2>EXERCISES</h2>
      <button id="btn-reset">reset</button>
    </div>
    <div id="prog-track"><div id="prog-fill"></div></div>
    <div id="prog-text">—</div>
  </div>
  <div id="panel">
    <div id="panel-empty">click any node</div>
    <div id="panel-content">
      <div id="panel-img-wrap"><img id="panel-img" src=""></div>
      <div id="panel-name"></div>
      <div id="panel-meta"></div>
      <div id="panel-sections"></div>
      <button id="panel-master-btn" style="display:none">mark as mastered</button>
    </div>
  </div>
</div>
<div id="tooltip"></div>

</body>
<script>
	// 1. IMPROVED NODE CREATION (Ensures proper layering)
for (const node of nodes) {
    const outer = mkEl('g', { 
        transform: `translate(${px(node)},${py(node)})`,
        style: 'cursor: pointer' 
    });
    const inner = mkEl('g', { class: 'node-inner' });

    // The Image
    inner.appendChild(mkEl('image', {
        href: node.image, x: -R, y: -R, width: R*2, height: R*2,
        style: 'pointer-events: none;' // Let clicks pass through to the ring
    }));

    // The Selection Ring (Placed AFTER image so it is on top)
    const ring = mkEl('circle', { 
        r: R + 2, 
        fill: 'transparent', 
        stroke: 'none', 
        'stroke-width': '8',
        class: 'selection-ring',
        style: 'pointer-events: all;' // This is our actual hit target
    });
    inner.appendChild(ring);

    // Event Listeners
    inner.addEventListener('mouseenter', e => showTip(node, e));
    inner.addEventListener('mousemove', moveTip);
    inner.addEventListener('mouseleave', () => tooltip.classList.remove('on'));
    
    inner.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (!wasDragging) {
            console.log('[von] Clicked node:', node.id, typeof node.id);
            selectNode(node.id);
        }
    });

    outer.appendChild(inner);
    world.appendChild(outer);
    outerEls.set(node.id, outer);
    innerEls.set(node.id, inner);
}

// 2. HARDENED SELECTION LOGIC
let selectedId = null;

const selectNode = id => {
    // Force ID to match the type used in nodeMap (usually numeric or string)
    // We try both to be safe against JSON vs LocalStorage mismatches
    const targetId = nodeMap.has(id) ? id : (nodeMap.has(Number(id)) ? Number(id) : String(id));
    
    console.log('[von] Selecting:', targetId);

    if (selectedId !== null) setRing(selectedId, false);
    selectedId = targetId;
    setRing(targetId, true);
    
    renderPanel(targetId);
    panTo(targetId);
};

const setRing = (id, on) => {
    const inner = innerEls.get(id);
    if (!inner) return;
    const ring = inner.querySelector('.selection-ring');
    if (ring) {
        ring.setAttribute('stroke', on ? '#ffffff' : 'none');
        ring.setAttribute('stroke-opacity', on ? '0.6' : '0');
    }
};

// 3. ROBUST SIDEBAR RENDER
const renderPanel = id => {
    const node = nodeMap.get(id);
    const state = gs.get(id);
    
    if (!node) {
        console.error('[von] Could not find node data for ID:', id);
        return;
    }

    // Toggle Visibility
    document.getElementById('panel-empty').style.display = 'none';
    const content = document.getElementById('panel-content');
    content.style.display = 'flex';

    // Update Header
    const img = document.getElementById('panel-img');
    img.src = node.image;
    img.className = (state === 'mastered') ? 'mastered' : '';

    const nameEl = document.getElementById('panel-name');
    nameEl.textContent = node.text;
    nameEl.style.color = (state === 'mastered') ? '#555' : (node.color || '#ccc');

    // Update Meta (Category)
    const catId = catOf.get(id);
    const catNode = nodeMap.get(catId) || node;
    const statusHtml = state === 'unlocked' 
        ? '<span class="status-unlocked">UNLOCKED</span>' 
        : '<span class="status-mastered">MASTERED</span>';
        
    document.getElementById('panel-meta').innerHTML = 
        `<span style="color:${catNode.color}aa">${catNode.text}</span> <span>·</span> ${statusHtml}`;

    // Clear and Rebuild Sections
    const sections = document.getElementById('panel-sections');
    sections.innerHTML = '';

    const createRow = (targetNid) => {
        const n2 = nodeMap.get(targetNid);
        const s2 = gs.get(targetNid);
        const row = document.createElement('div');
        row.className = 'panel-node-row';
        row.style.cursor = 'pointer';
        row.onclick = () => selectNode(targetNid);

        row.innerHTML = `
            <img src="${n2.image}" class="panel-thumb ${s2}">
            <div class="panel-node-name" style="color:${s2==='mastered'?'#333':(s2==='locked'?'#222':n2.color)}">
                ${n2.text}
            </div>
            <div class="panel-node-status">${s2 === 'mastered' ? '✓' : ''}</div>
        `;
        return row;
    };

    // Needs
    const pqs = prereqs.get(id) || [];
    if (pqs.length > 0) {
        const hdr = document.createElement('div');
        hdr.className = 'panel-section';
        hdr.textContent = 'NEEDS';
        sections.appendChild(hdr);
        pqs.forEach(pid => sections.appendChild(createRow(pid)));
    }

    // Unlocks
    const nexts = adj.get(id).filter(nb => (depth.get(nb) || 0) > (depth.get(id) || 0));
    if (nexts.length > 0) {
        const hdr = document.createElement('div');
        hdr.className = 'panel-section';
        hdr.textContent = 'UNLOCKS';
        sections.appendChild(hdr);
        nexts.forEach(nid => sections.appendChild(createRow(nid)));
    }

    // Master Button
    const btn = document.getElementById('panel-master-btn');
    if (state === 'unlocked') {
        btn.style.display = 'block';
        btn.style.borderColor = node.color + '88';
        btn.style.color = node.color;
        btn.onclick = () => {
            master(id);
            renderPanel(id); // Refresh
        };
    } else {
        btn.style.display = 'none';
    }
};
</script>
</html>
