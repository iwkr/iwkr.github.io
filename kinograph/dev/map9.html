<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Von - Skill Tree Pro</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    
    body { 
      display: flex; background: #050505; width: 100vw; height: 100vh; 
      overflow: hidden; font-family: monospace; color: #ccc; user-select: none; 
    }

    /* --- UI Layout --- */
    #map-wrap { flex: 1; overflow: hidden; position: relative; background: radial-gradient(circle at center, #0d0d0d 0%, #030303 100%); }
    #map { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
    #map.panning { cursor: grabbing; }

    #sidebar { 
      width: 300px; flex-shrink: 0; border-left: 1px solid #141414; 
      display: flex; flex-direction: column; background: #080808; z-index: 10;
    }

    #sidebar-head { padding: 20px; border-bottom: 1px solid #141414; }
    #prog-track { height: 2px; background: #111; margin: 12px 0; border-radius: 2px; }
    #prog-fill { height: 100%; width: 0%; background: #c6a252; transition: width 0.4s ease; }
    
    #panel { flex: 1; overflow-y: auto; }
    #panel-content { padding: 25px; display: none; flex-direction: column; }
    #panel-empty { padding: 50px; text-align: center; color: #333; font-size: 11px; letter-spacing: 1px; }
    
    #panel-img { 
      width: 110px; height: 110px; border-radius: 50%; margin: 0 auto 20px; 
      display: block; object-fit: cover; border: 2px solid #222; 
      transition: all 0.3s ease;
    }
    #panel-img.mastered { 
      border-color: #c6a252; 
      box-shadow: 0 0 15px rgba(198, 162, 82, 0.6);
    }

    .panel-section { 
      font-size: 10px; color: #444; margin: 25px 0 10px; 
      border-bottom: 1px solid #141414; padding-bottom: 5px; letter-spacing: 1px;
    }
    
    .panel-node-row { 
      display: flex; align-items: center; gap: 12px; 
      padding: 10px 0; cursor: pointer; 
    }
    .panel-thumb { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 1px solid #222; }
    
    #panel-master-btn { 
      margin-top: 30px; width: 100%; padding: 14px; 
      background: none; border: 1px solid #333; color: #888; 
      cursor: pointer; font-family: monospace; transition: all 0.2s;
    }
    #panel-master-btn:hover { background: #c6a252; color: #000; border-color: #c6a252; }

    #tooltip { 
      position: fixed; pointer-events: none; background: rgba(10,10,10,0.95); 
      color: #fff; padding: 6px 12px; border: 1px solid #222; 
      font-size: 11px; opacity: 0; z-index: 1000; border-radius: 3px;
      transition: color 0.2s;
    }
    #tooltip.on { opacity: 1; }

    /* --- Node Elements --- */
    .node-inner { 
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s, filter 0.3s; 
    }
    .node-inner:hover { transform: scale(1.12); }

    .node-circle {
      fill: #141414;
      stroke-width: 3px;
      transition: all 0.3s ease;
    }

    @keyframes pulse-ring {
      0% { stroke-opacity: 0.4; transform: rotate(0deg); }
      50% { stroke-opacity: 0.9; transform: rotate(180deg); }
      100% { stroke-opacity: 0.4; transform: rotate(360deg); }
    }
    .terminal-ring { transform-origin: center; animation: pulse-ring 14s infinite linear; }

    @keyframes edge-flow {
      to { stroke-dashoffset: -20; }
    }
    .active-edge {
      stroke-dasharray: 6, 6;
      animation: edge-flow 1.5s linear infinite;
    }
  </style>
</head>
<body>

<div id="map-wrap">
  <svg id="map">
    <defs>
      <filter id="gold-glow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#c6a252" flood-opacity="0.8"/>
      </filter>
    </defs>
    <g id="world"></g>
  </svg>
</div>

<div id="sidebar">
  <div id="sidebar-head">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2 style="font-size:10px; color:#444; letter-spacing:2px;">EXERCISES</h2>
      <button id="btn-reset" style="font-size:9px; background:none; border:1px solid #222; color:#444; padding:3px 7px; cursor:pointer;">RESET</button>
    </div>
    <div id="prog-track"><div id="prog-fill"></div></div>
    <div id="prog-text" style="font-size:10px; color:#333;">0 / 0 mastered</div>
  </div>
  <div id="panel">
    <div id="panel-empty">SELECT A DISCOVERED NODE</div>
    <div id="panel-content">
      <img id="panel-img" src="">
      <h1 id="panel-name" style="font-size:18px; text-align:center; margin-bottom:5px;"></h1>
      <div id="panel-meta" style="font-size:10px; text-align:center; color:#555; margin-bottom:20px;"></div>
      <div id="panel-sections"></div>
      <button id="panel-master-btn">MARK AS MASTERED</button>
    </div>
  </div>
</div>

<div id="tooltip"></div>

<script>
async function main() {
  console.log('[von] Upgraded rendering engine initialized.');

  const svg = document.getElementById('map');
  const world = document.getElementById('world');
  const tooltip = document.getElementById('tooltip');
  const LS_KEY = 'von_v6_state';

  // --- 1. Data Processing ---
  let data;
  try {
    const res = await fetch('graph.json');
    data = await res.json();
  } catch (e) {
    console.error('[von] Missing graph.json. Ensure file is in directory.');
    return;
  }

  const nodes = data.nodes.map(n => ({ ...n, id: String(n.id) }));
  const links = data.links.map(l => ({ ...l, source: String(l.source), target: String(l.target) }));
  const nodeMap = new Map(nodes.map(n => [n.id, n]));
  const adj = new Map(nodes.map(n => [n.id, []]));
  
  links.forEach(l => {
    adj.get(l.source).push(l.target);
    adj.get(l.target).push(l.source);
  });

  // --- 2. Hierarchy ---
  const depth = new Map(), catOf = new Map(), queue = [];
  
  nodes.filter(n => n.start).forEach(n => {
    depth.set(n.id, 0); 
    catOf.set(n.id, n.id); 
    queue.push(n.id);
  });

  for (let i = 0; i < queue.length; i++) {
    const curr = queue[i];
    adj.get(curr).forEach(nb => {
      if (!depth.has(nb)) {
        depth.set(nb, depth.get(curr) + 1);
        catOf.set(nb, catOf.get(curr));
        queue.push(nb);
      }
    });
  }

  const prereqs = new Map(nodes.map(n => [
    n.id, adj.get(n.id).filter(nb => (depth.get(nb) ?? 0) < (depth.get(n.id) ?? 0))
  ]));

  // --- 3. State Management ---
  const gs = new Map(nodes.map(n => [n.id, 'locked']));
  const save = () => localStorage.setItem(LS_KEY, JSON.stringify(Object.fromEntries(gs)));
  
  const load = () => {
    const saved = localStorage.getItem(LS_KEY);
    if (!saved) return false;
    Object.entries(JSON.parse(saved)).forEach(([k, v]) => gs.set(k, v));
    return true;
  };

  if (!load()) {
    nodes.forEach(n => {
      if (n.start) gs.set(n.id, 'mastered');
      else if (depth.get(n.id) === 1) gs.set(n.id, 'unlocked');
    });
  }

  // --- 4. Render Engine ---
  const mkEl = (tag, attrs) => {
    const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (let k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  };

  const R = nodes[0].radius || 40;
  const linkEls = new Map(), outerEls = new Map(), innerEls = new Map();

  links.forEach(l => {
    const s = nodeMap.get(l.source), t = nodeMap.get(l.target);
    const line = mkEl('line', {
      x1: s.x, y1: s.y, x2: t.x, y2: t.y,
      stroke: l.color, 'stroke-width': 4, 'stroke-linecap': 'round', opacity: 0
    });
    world.appendChild(line);
    linkEls.set(`${l.source}-${l.target}`, line);
    linkEls.set(`${l.target}-${l.source}`, line);
  });

  nodes.forEach(node => {
    const outer = mkEl('g', { transform: `translate(${node.x},${node.y})` });
    const inner = mkEl('g', { class: 'node-inner', style: 'cursor:pointer;' });

    // Background circle container for node visual effects
    const bgCircle = mkEl('circle', {
      r: R + 1,
      class: 'node-circle',
      stroke: '#333'
    });
    inner.appendChild(bgCircle);

    // Node image
    const imgSize = R * 1.35;
    const img = mkEl('image', {
      href: node.image,
      x: -imgSize / 2,
      y: -imgSize / 2,
      width: imgSize,
      height: imgSize,
      style: 'pointer-events:none; border-radius: 50%; clip-path: circle(50%);'
    });
    inner.appendChild(img);

    // Dynamic border ring
    const borderRing = mkEl('circle', {
      r: R + 4,
      fill: 'none',
      'stroke-width': 2.5
    });
    inner.appendChild(borderRing);

    // Terminal Node Marker 
    const children = adj.get(node.id).filter(nb => (depth.get(nb) || 0) > (depth.get(node.id) || 0));
    if (children.length === 0) {
      inner.appendChild(mkEl('circle', {
        r: R + 9, fill: 'none', stroke: node.color, 'stroke-width': 2, 'stroke-dasharray': '4,6',
        class: 'terminal-ring'
      }));
    }

    // Hit area for interaction
    const hit = mkEl('circle', { r: R + 6, fill: 'white', 'fill-opacity': 0, stroke: 'none', class: 'hit-area' });
    inner.appendChild(hit);

    // Event Handlers
    inner.addEventListener('click', (e) => {
      e.stopPropagation();
      const state = gs.get(node.id);
      const isTeaser = (state === 'locked') && prereqs.get(node.id).some(p => gs.get(p) === 'mastered');
      if (!wasDragging && (state !== 'locked' || isTeaser)) {
        selectNode(node.id);
      }
    });

    inner.addEventListener('mouseenter', () => {
      const state = gs.get(node.id);
      const isTeaser = (state === 'locked') && prereqs.get(node.id).some(p => gs.get(p) === 'mastered');
      if (state === 'locked' && !isTeaser) return;

      tooltip.textContent = isTeaser ? '🔒 Locked Node' : node.text;
      tooltip.style.color = isTeaser ? '#777' : node.color;
      tooltip.classList.add('on');
    });

    inner.addEventListener('mouseleave', () => tooltip.classList.remove('on'));

    outer.appendChild(inner);
    world.appendChild(outer);
    outerEls.set(node.id, outer);
    innerEls.set(node.id, inner);
  });

  // --- 5. UI Updates ---
  const updateMap = () => {
    nodes.forEach(n => {
      const state = gs.get(n.id);
      const isTeaser = (state === 'locked') && prereqs.get(n.id).some(p => gs.get(p) === 'mastered');
      const outer = outerEls.get(n.id);
      const inner = innerEls.get(n.id);
      const borderRing = inner.querySelector('circle:nth-of-type(2)');
      const bgCircle = inner.querySelector('.node-circle');

      if (state === 'mastered') {
        outer.style.display = '';
        inner.style.opacity = '1';
        
        bgCircle.style.stroke = '#c6a252';
        bgCircle.style.filter = 'url(#gold-glow)';

        borderRing.style.stroke = '#c6a252';
        borderRing.style.strokeDasharray = 'none';
        borderRing.style.opacity = '1';
      } else if (state === 'unlocked') {
        outer.style.display = '';
        inner.style.opacity = '1';

        bgCircle.style.stroke = n.color || '#555';
        bgCircle.style.filter = 'none';

        borderRing.style.stroke = n.color || '#999';
        borderRing.style.strokeDasharray = 'none';
        borderRing.style.opacity = '0.6';
      } else if (isTeaser) {
        // Teaser or accessible paths
        outer.style.display = '';
        inner.style.opacity = '0.7';

        bgCircle.style.stroke = '#444';
        bgCircle.style.filter = 'none';

        borderRing.style.stroke = '#c6a252';
        borderRing.style.strokeDasharray = '3,3';
        borderRing.style.opacity = '0.8';
      } else {
        // Truly locked node that cannot be unlocked, hide
        outer.style.display = 'none';
      }
    });

    links.forEach(l => {
      const line = linkEls.get(`${l.source}-${l.target}`);
      const s1 = gs.get(l.source), s2 = gs.get(l.target);
      const teaser1 = (s1 === 'locked') && prereqs.get(l.source).some(p => gs.get(p) === 'mastered');
      const teaser2 = (s2 === 'locked') && prereqs.get(l.target).some(p => gs.get(p) === 'mastered');

      if ((s1 !== 'locked' || teaser1) && (s2 !== 'locked' || teaser2)) {
        line.style.opacity = 0.6;
        if (s1 === 'mastered' && s2 === 'mastered') {
          line.classList.add('active-edge');
          line.setAttribute('stroke', '#c6a252');
        } else {
          line.classList.remove('active-edge');
          line.setAttribute('stroke', l.color || '#444');
        }
      } else {
        line.style.opacity = 0.05;
        line.classList.remove('active-edge');
        line.setAttribute('stroke', '#222');
      }
    });
  };

  let selectedId = null;
  const selectNode = (id) => {
    if (selectedId) innerEls.get(selectedId).querySelector('.hit-area').setAttribute('stroke', 'none');
    selectedId = id;
    const hit = innerEls.get(id).querySelector('.hit-area');
    
    hit.setAttribute('stroke', '#c6a252'); 
    hit.setAttribute('stroke-width', '3'); 
    hit.setAttribute('stroke-opacity', '0.9');

    renderPanel(id);
    panTo(id);
  };

  const renderPanel = (id) => {
    const n = nodeMap.get(id);
    const s = gs.get(id);
    const isTeaser = (s === 'locked');
    
    document.getElementById('panel-empty').style.display = 'none';
    const content = document.getElementById('panel-content');
    content.style.display = 'flex';

    const img = document.getElementById('panel-img');
    img.src = n.image;
    img.className = (s === 'mastered' ? 'mastered' : '');
    img.style.filter = isTeaser ? 'grayscale(1) brightness(0.4)' : 'none';
    
    const nameEl = document.getElementById('panel-name');
    nameEl.textContent = isTeaser ? 'LOCKED EXERCISE' : n.text;
    nameEl.style.color = isTeaser ? '#444' : (s === 'mastered' ? '#c6a252' : n.color);

    const catNode = nodeMap.get(catOf.get(id)) || n;
    document.getElementById('panel-meta').innerHTML = isTeaser 
      ? 'COMPLETE PREREQUISITES TO REVEAL' 
      : `<span style="color:${catNode.color}88">${catNode.text}</span> · ${s.toUpperCase()}`;

    const sections = document.getElementById('panel-sections');
    sections.innerHTML = '';

    if (!isTeaser) {
      const drawList = (label, ids) => {
        if (!ids.length) return;
        const h = document.createElement('div'); h.className = 'panel-section'; h.textContent = label;
        sections.appendChild(h);
        ids.forEach(tid => {
          const n2 = nodeMap.get(tid), s2 = gs.get(tid);
          const row = document.createElement('div'); row.className = 'panel-node-row';
          row.onclick = () => selectNode(tid);
          row.innerHTML = `<img src="${n2.image}" class="panel-thumb" style="filter:${s2==='locked'?'brightness(0.1)':(s2==='mastered'?'grayscale(1) brightness(0.8)':'none')}">
                           <div style="font-size:11px; color:${s2==='locked'?'#444':(s2==='mastered'?'#777':n2.color)}">${n2.text}</div>`;
          sections.appendChild(row);
        });
      };
      
      drawList('NEEDS', prereqs.get(id));
      drawList('UNLOCKS', adj.get(id).filter(nb => (depth.get(nb) || 0) > (depth.get(id) || 0)));
    }

    const btn = document.getElementById('panel-master-btn');
    btn.style.display = (s === 'unlocked' ? 'block' : 'none');
    btn.onclick = () => {
      gs.set(id, 'mastered');
      adj.get(id).forEach(nb => {
        if (gs.get(nb) === 'locked' && prereqs.get(nb).every(p => gs.get(p) === 'mastered')) gs.set(nb, 'unlocked');
      });
      save(); 
      updateMap(); 
      updateProgressDisplay();
      renderPanel(id);
    };
  };

  const updateProgressDisplay = () => {
    const mastered = nodes.filter(n => gs.get(n.id) === 'mastered').length;
    document.getElementById('prog-fill').style.width = `${(mastered / nodes.length) * 100}%`;
    document.getElementById('prog-text').textContent = `${mastered} / ${nodes.length} mastered`;
  };

  // --- 6. Camera Navigation ---
  let view = { x: 0, y: 0, scale: 0.55 }, drag = null, wasDragging = false;
  const commit = () => world.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.scale})`);
  
  const panTo = (id) => {
    const n = nodeMap.get(id), rect = svg.getBoundingClientRect();
    view.x = rect.width/2 - n.x * view.scale; 
    view.y = rect.height/2 - n.y * view.scale;
    commit();
  };

  svg.addEventListener('pointerdown', e => { 
    drag = { ox: view.x - e.clientX, oy: view.y - e.clientY, x0: e.clientX, y0: e.clientY }; 
    wasDragging = false; 
    svg.classList.add('panning'); 
  });
  
  window.addEventListener('pointermove', e => { 
    if (!drag) return; 
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 4) wasDragging = true; 
    view.x = e.clientX + drag.ox; 
    view.y = e.clientY + drag.oy; 
    commit(); 
  });
  
  window.addEventListener('pointerup', () => { 
    drag = null; 
    svg.classList.remove('panning'); 
  });
  
  svg.addEventListener('wheel', e => { 
    e.preventDefault(); 
    const k = e.deltaY < 0 ? 1.1 : 0.9; 
    view.x = e.clientX + (view.x - e.clientX) * k; 
    view.y = e.clientY + (view.y - e.clientY) * k; 
    view.scale *= k; 
    commit(); 
  }, { passive: false });

  window.addEventListener('mousemove', e => { 
    if (!tooltip.classList.contains('on')) return; 
    tooltip.style.left = `${e.clientX + 15}px`; 
    tooltip.style.top = `${e.clientY + 15}px`; 
  });

  document.getElementById('btn-reset').onclick = () => { 
    if (confirm('Reset exercise progress?')) { 
      localStorage.clear(); 
      location.reload(); 
    } 
  };

  // Default Center View
  const rect = svg.getBoundingClientRect();
  const vxs = nodes.filter(n => n.start).map(n => n.x);
  const vys = nodes.filter(n => n.start).map(n => n.y);
  if (vxs.length) {
    view.x = rect.width/2 - vxs[0] * view.scale; 
    view.y = rect.height/2 - vys[0] * view.scale;
  }

  updateMap();
  updateProgressDisplay();
  commit();
  console.log('[von] Renderer and engine fully updated.');
}

main();
</script>
</body>
</html>
