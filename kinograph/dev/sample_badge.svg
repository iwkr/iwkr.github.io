<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340">
  <!-- bg fill in node colour -->
  <circle cx="170" cy="170" r="170" fill="#d8fafe"/>

  <!-- figure: straight punch — shoulder, torso, extended arm -->
  <!-- torso -->
  <rect x="138" y="148" width="44" height="72" rx="10" fill="#1a1714"/>
  <!-- head -->
  <circle cx="160" cy="126" r="24" fill="#1a1714"/>
  <!-- extended arm (the punch) -->
  <rect x="72" y="158" width="90" height="22" rx="11" fill="#1a1714"/>
  <!-- fist -->
  <rect x="58" y="152" width="28" height="34" rx="8" fill="#1a1714"/>
  <!-- rear arm hint -->
  <rect x="170" y="162" width="44" height="16" rx="8" fill="#3a3530" opacity="0.5"/>

  <!-- outer ring accent -->
  <circle cx="170" cy="170" r="158" fill="none" stroke="#1a1714" stroke-width="4" opacity="0.12"/>
</svg>
