<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Von</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: flex;
      background: #080808;
      width: 100vw; height: 100vh;
      overflow: hidden;
      font-family: monospace;
      color: #ccc;
    }

    /* ── Map ── */
    #map-wrap { flex: 1; overflow: hidden; }
    #map { display: block; width: 100%; height: 100%; cursor: grab; }
    #map.panning { cursor: grabbing; }

    /* ── Sidebar ── */
    #sidebar {
      width: 272px; flex-shrink: 0;
      border-left: 1px solid #161616;
      display: flex; flex-direction: column;
    }

    #sidebar-head {
      padding: 16px 16px 13px;
      border-bottom: 1px solid #161616;
      flex-shrink: 0;
    }
    #head-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    #head-row h2 { font-size: 10px; letter-spacing: 0.14em; color: #333; }
    #btn-reset {
      font: 10px/1 monospace; letter-spacing: 0.05em;
      background: none; border: 1px solid #1e1e1e; color: #282828;
      padding: 3px 8px; border-radius: 3px; cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    #btn-reset:hover { color: #888; border-color: #444; }
    #prog-track { height: 2px; background: #161616; border-radius: 2px; }
    #prog-fill  { height: 100%; width: 0; background: #3e3e3e; border-radius: 2px; transition: width 0.5s; }
    #prog-text  { font-size: 11px; color: #2a2a2a; margin-top: 7px; }

    /* ── Panel ── */
    #panel {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column;
    }
    #panel::-webkit-scrollbar { width: 3px; }
    #panel::-webkit-scrollbar-thumb { background: #181818; border-radius: 2px; }

    #panel-empty {
      flex: 1; display: flex; align-items: center; justify-content: center;
      font-size: 11px; color: #222; letter-spacing: 0.06em;
      text-align: center; padding: 20px;
    }

    #panel-content { padding: 20px 18px 28px; display: none; flex-direction: column; gap: 0; }

    #panel-img-wrap {
      width: 100px; height: 100px;
      border-radius: 50%; overflow: hidden;
      margin: 0 auto 16px;
      flex-shrink: 0;
    }
    #panel-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    #panel-img.mastered { filter: grayscale(1) brightness(0.45); }

    #panel-name {
      font-size: 14px; font-weight: bold; letter-spacing: 0.05em;
      text-align: center; margin-bottom: 5px;
    }
    #panel-meta {
      font-size: 10px; letter-spacing: 0.08em; color: #333;
      text-align: center; margin-bottom: 20px;
    }
    #panel-meta span { margin: 0 4px; }
    .status-unlocked { color: #4a8; }
    .status-mastered { color: #333; }

    .panel-section {
      font-size: 10px; letter-spacing: 0.1em; color: #2a2a2a;
      margin-bottom: 8px; margin-top: 16px;
    }
    .panel-section:first-of-type { margin-top: 0; }

    .panel-node-row {
      display: flex; align-items: center; gap: 9px;
      padding: 5px 0;
    }
    .panel-thumb {
      width: 30px; height: 30px;
      border-radius: 50%; flex-shrink: 0; object-fit: cover;
    }
    .panel-thumb.mastered { filter: grayscale(1) brightness(0.45); }
    .panel-thumb.locked   { filter: grayscale(1) brightness(0.2); }

    .panel-node-name {
      font-size: 11px; letter-spacing: 0.03em;
      flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .panel-node-status { font-size: 11px; color: #2a2a2a; flex-shrink: 0; }

    #panel-master-btn {
      margin-top: 22px;
      width: 100%; padding: 10px;
      font: 11px/1 monospace; letter-spacing: 0.1em;
      background: none; border: 1px solid #222; color: #555;
      border-radius: 4px; cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    #panel-master-btn:hover { color: #ddd; border-color: #666; }

    /* ── Tooltip ── */
    #tooltip {
      position: fixed; z-index: 9;
      background: rgba(8,8,8,0.95);
      border: 1px solid #1e1e1e;
      color: #888; padding: 8px 12px;
      border-radius: 5px; font-size: 11px; line-height: 1.6;
      pointer-events: none; opacity: 0; transition: opacity 0.1s;
      white-space: nowrap;
    }
    #tooltip.on { opacity: 1; }

    /* ── Node animations ── */
    .node-inner { transition: filter 0.35s; }
    @keyframes pop-in {
      from { transform: scale(0.4); opacity: 0; }
      65%  { transform: scale(1.1); }
      to   { transform: scale(1);   opacity: 1; }
    }
    .node-inner.popping { animation: pop-in 0.4s cubic-bezier(.22,1,.36,1) both; }

    /* selection ring applied via JS setAttribute, not CSS */
  </style>
</head>
<body>

<div id="map-wrap">
  <svg id="map"><g id="world"></g></svg>
</div>
<div id="sidebar">
  <div id="sidebar-head">
    <div id="head-row">
      <h2>EXERCISES</h2>
      <button id="btn-reset">reset</button>
    </div>
    <div id="prog-track"><div id="prog-fill"></div></div>
    <div id="prog-text">—</div>
  </div>
  <div id="panel">
    <div id="panel-empty">click any node</div>
    <div id="panel-content">
      <div id="panel-img-wrap"><img id="panel-img" src=""></div>
      <div id="panel-name"></div>
      <div id="panel-meta"></div>
      <div id="panel-sections"></div>
      <button id="panel-master-btn" style="display:none">mark as mastered</button>
    </div>
  </div>
</div>
<div id="tooltip"></div>

<script>
const PADDING = 220;
const LS_KEY  = 'von_state_v1';

async function main() {
  const { nodes, links } = await fetch('graph.json').then(r => r.json());
  console.log('[von] loaded graph —', nodes.length, 'nodes,', links.length, 'links');

  // ── Geometry ──────────────────────────────────────────────────────────────
  const R  = nodes[0].radius;
  const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y);
  const ox = Math.min(...xs) - R - PADDING;
  const oy = Math.min(...ys) - R - PADDING;
  const W  = Math.max(...xs) - Math.min(...xs) + 2 * (R + PADDING);
  const H  = Math.max(...ys) - Math.min(...ys) + 2 * (R + PADDING);
  const px = n => n.x - ox;
  const py = n => n.y - oy;

  // ── Graph ─────────────────────────────────────────────────────────────────
  const nodeMap = new Map(nodes.map(n => [n.id, n]));
  const adj     = new Map(nodes.map(n => [n.id, []]));
  for (const { source, target } of links) {
    adj.get(source).push(target);
    adj.get(target).push(source);
  }

  // Multi-source BFS → depth + category
  const depth = new Map(), catOf = new Map();
  const bfsQ  = [];
  for (const n of nodes.filter(n => n.start)) {
    depth.set(n.id, 0); catOf.set(n.id, n.id); bfsQ.push(n.id);
  }
  for (let i = 0; i < bfsQ.length; i++) {
    const id = bfsQ[i];
    for (const nb of adj.get(id)) {
      if (!depth.has(nb)) {
        depth.set(nb, depth.get(id) + 1);
        catOf.set(nb, catOf.get(id));
        bfsQ.push(nb);
      }
    }
  }

  const d1count = [...depth.values()].filter(d => d === 1).length;
  console.log('[von] BFS done — roots:', nodes.filter(n=>n.start).length, '| depth-1 nodes:', d1count, '| total reached:', depth.size);

  // prereqs[id] = shallower neighbors (must be mastered to unlock this)
  const prereqs = new Map(nodes.map(n => [
    n.id,
    adj.get(n.id).filter(nb => (depth.get(nb) ?? 0) < (depth.get(n.id) ?? 0)),
  ]));

  // ── Game state ────────────────────────────────────────────────────────────
  const gs = new Map(nodes.map(n => [n.id, 'locked']));

  const save = () =>
    localStorage.setItem(LS_KEY, JSON.stringify(Object.fromEntries(gs)));

  const load = () => {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return false;
    try {
      for (const [id, v] of Object.entries(JSON.parse(raw))) gs.set(+id, v);
      return true;
    } catch { return false; }
  };

  const seed = () => {
    for (const n of nodes) {
      if (n.start)                   gs.set(n.id, 'mastered');
      else if (depth.get(n.id) === 1) gs.set(n.id, 'unlocked');
      else                            gs.set(n.id, 'locked');
    }
  };

  const loaded = load();
  const allLocked = ![...gs.values()].some(s => s !== 'locked');
  console.log('[von] load():', loaded, '| all locked after load:', allLocked);
  if (!loaded || allLocked) { seed(); console.log('[von] seeded'); }
  const counts = { locked: 0, unlocked: 0, mastered: 0 };
  for (const v of gs.values()) counts[v]++;
  console.log('[von] state after init:', counts);

  // ── SVG ───────────────────────────────────────────────────────────────────
  const svg     = document.getElementById('map');
  const world   = document.getElementById('world');
  const tooltip = document.getElementById('tooltip');

  const mkEl = (tag, attrs = {}) => {
    const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    return e;
  };

  // Links
  const linkEls = new Map();
  for (const { source, target, color } of links) {
    const s = nodeMap.get(source), t = nodeMap.get(target);
    const line = mkEl('line', {
      x1: px(s), y1: py(s), x2: px(t), y2: py(t),
      stroke: color, 'stroke-width': 18, 'stroke-linecap': 'round',
    });
    world.appendChild(line);
    linkEls.set(`${source}-${target}`, line);
    linkEls.set(`${target}-${source}`, line);
  }

  // Nodes
  const outerEls = new Map(), innerEls = new Map();
  for (const node of nodes) {
    const outer = mkEl('g', { transform: `translate(${px(node)},${py(node)})` });
    const inner = mkEl('g', { class: 'node-inner' });

inner.appendChild(mkEl('image', {
  href: node.image,
  x: -R, y: -R,
  width: R*2, height: R*2,
  style: 'pointer-events: none;'
}));
    // Hit + optional selection ring (transparent fill, stroke only when .selected-node)
    const hitRing = mkEl('circle', { r: R, fill: 'transparent', class: 'hit-ring' });
    inner.appendChild(hitRing);

    inner.addEventListener('mouseenter', e => showTip(node, e));
    inner.addEventListener('mousemove',  moveTip);
    inner.addEventListener('mouseleave', () => tooltip.classList.remove('on'));
    inner.addEventListener('click',      () => { if (!wasDragging) selectNode(node.id); });

    outer.appendChild(inner);
    world.appendChild(outer);
    outerEls.set(node.id, outer);
    innerEls.set(node.id, inner);
  }

  // ── Styling ───────────────────────────────────────────────────────────────
  const styleNode = id => {
    const outer = outerEls.get(id), inner = innerEls.get(id);
    const s = gs.get(id);
    outer.style.display = s === 'locked' ? 'none' : '';
    // grayscale+brightness keeps the circle opaque so lines stay hidden underneath
    inner.style.filter  = s === 'mastered' ? 'grayscale(1) brightness(0.42)' : '';
  };

  const styleLinks = () => {
    for (const { source, target } of links) {
      const line = linkEls.get(`${source}-${target}`);
      const ss = gs.get(source), ts = gs.get(target);
      if (ss === 'locked' || ts === 'locked') {
        line.style.display = 'none';
      } else {
        line.style.display  = '';
        line.style.opacity  = ss === 'mastered' && ts === 'mastered' ? '0.15' : '1';
      }
    }
  };

  const applyAll = () => {
    for (const n of nodes) styleNode(n.id);
    styleLinks();
    const vis = nodes.filter(n => outerEls.get(n.id).style.display !== 'none').length;
    console.log('[von] applyAll: visible nodes =', vis);
  };
  applyAll();

  // ── Master a node ─────────────────────────────────────────────────────────
  const master = id => {
    if (gs.get(id) !== 'unlocked') return;
    gs.set(id, 'mastered');
    styleNode(id);

    for (const nb of adj.get(id)) {
      if (gs.get(nb) !== 'locked') continue;
      if (prereqs.get(nb).every(p => gs.get(p) === 'mastered')) {
        gs.set(nb, 'unlocked');
        styleNode(nb);
        const inner = innerEls.get(nb);
        inner.classList.remove('popping');
        void inner.getBoundingClientRect();
        inner.classList.add('popping');
        inner.addEventListener('animationend', () => inner.classList.remove('popping'), { once: true });
      }
    }

    styleLinks();
    save();
    if (selectedId === id) renderPanel(id);
    updateProgress();
  };

  // ── Progress ──────────────────────────────────────────────────────────────
  const updateProgress = () => {
    const total = nodes.length;
    const done  = [...gs.values()].filter(s => s === 'mastered').length;
    const pct   = `${(done / total * 100).toFixed(1)}%`;
    console.log('[von] progress:', done, '/', total, '=', pct);
    document.getElementById('prog-fill').style.width = pct;
    document.getElementById('prog-text').textContent = `${done} / ${total} mastered`;
  };
  updateProgress();

  // ── Node selection + panel ────────────────────────────────────────────────
  let selectedId = null;

  const setRing = (id, on) => {
    const inner = innerEls.get(id);
    if (!inner) return;
    const ring = inner.querySelector('circle');
    ring.setAttribute('stroke',         on ? '#fff' : 'none');
    ring.setAttribute('stroke-width',   on ? '10'   : '0');
    ring.setAttribute('stroke-opacity', on ? '0.4'  : '0');
  };

  const selectNode = id => {
    console.log('[von] selectNode', id, nodeMap.get(id)?.text, gs.get(id));
    if (selectedId !== null) setRing(selectedId, false);
    selectedId = id;
    setRing(id, true);
    renderPanel(id);
    panTo(id);
  };

  const renderPanel = id => {
    const node = nodeMap.get(id);
    const s    = gs.get(id);
    console.log('[von] renderPanel', id, node?.text, s);

    document.getElementById('panel-empty').style.display   = 'none';
    const content = document.getElementById('panel-content');
    content.style.cssText = 'display:flex; flex-direction:column; padding:20px 18px 28px;';

    const img = document.getElementById('panel-img');
    img.src       = node.image;
    img.className = s === 'mastered' ? 'mastered' : '';

    document.getElementById('panel-name').textContent  = node.text;
    document.getElementById('panel-name').style.color  = s === 'mastered' ? '#333' : node.color;

    const catNode = nodeMap.get(catOf.get(id));
    const statusLabel = s === 'unlocked'
      ? '<span class="status-unlocked">unlocked</span>'
      : '<span class="status-mastered">mastered</span>';
    document.getElementById('panel-meta').innerHTML =
      `<span style="color:${catNode.color}88">${catNode.text}</span><span>·</span>${statusLabel}`;

    // Prereqs + unlocks
    const pqs   = prereqs.get(id);
    const nexts = adj.get(id).filter(nb => (depth.get(nb) ?? 0) > (depth.get(id) ?? 0));

    const sections = document.getElementById('panel-sections');
    sections.innerHTML = '';

    const addSection = (label, nodeIds) => {
      if (!nodeIds.length) return;
      const hdr = document.createElement('div');
      hdr.className = 'panel-section';
      hdr.textContent = label;
      sections.appendChild(hdr);
      for (const nid of nodeIds) {
        const n2  = nodeMap.get(nid);
        const s2  = gs.get(nid);
        const row = document.createElement('div');
        row.className = 'panel-node-row';
        row.style.cursor = 'pointer';
        row.addEventListener('click', () => selectNode(nid));

        const thumb = document.createElement('img');
        thumb.className = 'panel-thumb' + (s2 === 'mastered' ? ' mastered' : s2 === 'locked' ? ' locked' : '');
        thumb.src = n2.image;

        const name = document.createElement('div');
        name.className = 'panel-node-name';
        name.textContent = n2.text;
        name.style.color = s2 === 'mastered' ? '#2e2e2e' : s2 === 'locked' ? '#222' : n2.color;

        const status = document.createElement('div');
        status.className = 'panel-node-status';
        status.textContent = s2 === 'mastered' ? '✓' : s2 === 'locked' ? '·' : '';

        row.append(thumb, name, status);
        sections.appendChild(row);
      }
    };

    addSection('NEEDS', pqs);
    addSection('UNLOCKS', nexts);

    const btn = document.getElementById('panel-master-btn');
    if (s === 'unlocked') {
      btn.style.display = '';
      btn.style.borderColor = node.color + '55';
      btn.style.color       = node.color + 'cc';
      btn.onclick = () => master(id);
    } else {
      btn.style.display = 'none';
    }
  };

  document.getElementById('btn-reset').addEventListener('click', () => {
    localStorage.removeItem(LS_KEY);
    for (const n of nodes) gs.set(n.id, 'locked');
    seed();
    applyAll();
    updateProgress();
    if (selectedId !== null) renderPanel(selectedId);
  });

  // ── Pan to node ───────────────────────────────────────────────────────────
  const panTo = id => {
    const n = nodeMap.get(id);
    const { width: w, height: h } = svgRect();
    view.x = w / 2 - px(n) * view.scale;
    view.y = h / 2 - py(n) * view.scale;
    commitView();
  };

  // ── Tooltip ───────────────────────────────────────────────────────────────
  function moveTip(e) {
    tooltip.style.left = `${Math.min(e.clientX + 16, innerWidth  - 200)}px`;
    tooltip.style.top  = `${Math.min(e.clientY + 14, innerHeight -  40)}px`;
  }

  function showTip(node, e) {
    if (gs.get(node.id) === 'locked') return;
    tooltip.textContent = node.text;
    tooltip.style.color = node.color;
    tooltip.classList.add('on');
    moveTip(e);
  }

  // ── Pan & zoom ────────────────────────────────────────────────────────────
  // Use getBoundingClientRect — svg.clientWidth is 0 on SVG elements in most browsers
  const svgRect = () => svg.getBoundingClientRect();

  const visNodes = nodes.filter(n => gs.get(n.id) !== 'locked');
  const vxs = visNodes.map(px), vys = visNodes.map(py);
  const vcx = (Math.min(...vxs) + Math.max(...vxs)) / 2;
  const vcy = (Math.min(...vys) + Math.max(...vys)) / 2;
  const vW  = Math.max(...vxs) - Math.min(...vxs) + R * 4;
  const vH  = Math.max(...vys) - Math.min(...vys) + R * 4;
  const { width: svgW, height: svgH } = svgRect();
  const s0  = Math.min(svgW / vW, svgH / vH) * 0.82;
  console.log('[von] svgW:', svgW, 'svgH:', svgH, 'vW:', vW.toFixed(0), 'vH:', vH.toFixed(0), 's0:', s0.toFixed(4));

  const view = {
    x: svgW / 2 - vcx * s0,
    y: svgH / 2 - vcy * s0,
    scale: s0,
  };
  console.log('[von] initial view:', JSON.stringify(view, (k,v) => typeof v==='number' ? +v.toFixed(2) : v));

  const commitView = () =>
    world.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.scale})`);
  commitView();

  let drag = null, wasDragging = false;

  svg.addEventListener('pointerdown', e => {
    wasDragging = false;
    drag = { ox: view.x - e.clientX, oy: view.y - e.clientY, x0: e.clientX, y0: e.clientY };
    svg.classList.add('panning');
    tooltip.classList.remove('on');
    svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener('pointermove', e => {
    if (!drag) return;
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 4) wasDragging = true;
    view.x = e.clientX + drag.ox;
    view.y = e.clientY + drag.oy;
    commitView();
  });
  svg.addEventListener('pointerup', () => { drag = null; svg.classList.remove('panning'); });
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const k = e.deltaY < 0 ? 1.12 : 1 / 1.12;
    view.x = e.clientX + (view.x - e.clientX) * k;
    view.y = e.clientY + (view.y - e.clientY) * k;
    view.scale *= k;
    commitView();
  }, { passive: false });
}

main().catch(err => console.error('Von:', err));
</script>
</body>
</html>
