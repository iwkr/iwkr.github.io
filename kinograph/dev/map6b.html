<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Von - Skill Tree</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { display: flex; background: #050505; width: 100vw; height: 100vh; overflow: hidden; font-family: sans-serif; color: #ccc; user-select: none; }

    #map-wrap { flex: 1; overflow: hidden; position: relative; background: #050505; }
    #map { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
    #map.panning { cursor: grabbing; }

    #sidebar { width: 320px; flex-shrink: 0; border-left: 1px solid #1a1a1a; display: flex; flex-direction: column; background: #080808; z-index: 10; }
    #sidebar-head { padding: 25px; border-bottom: 1px solid #1a1a1a; }
    #prog-track { height: 4px; background: #111; margin: 15px 0; border-radius: 2px; }
    #prog-fill { height: 100%; width: 0%; background: #d4af37; transition: width 0.6s ease; box-shadow: 0 0 10px #d4af37; }
    
    #panel { flex: 1; overflow-y: auto; padding: 20px; }
    #panel-content { display: none; flex-direction: column; }
    
    #panel-img { width: 100px; height: 100px; border-radius: 12px; margin: 0 auto 20px; border: 2px solid #222; }
    #panel-img.mastered { border-color: #d4af37; box-shadow: 0 0 20px rgba(212,175,55,0.2); }

    .node-inner { transition: transform 0.2s; }
    .node-inner:hover { transform: scale(1.05); }

    @keyframes pulse-halo { 0% { opacity: 0.2; transform: scale(1); } 50% { opacity: 0.6; transform: scale(1.1); } 100% { opacity: 0.2; transform: scale(1); } }
    .halo { animation: pulse-halo 3s infinite ease-in-out; }
    
    @keyframes flow { to { stroke-dashoffset: -20; } }
    .path-active { stroke-dasharray: 4, 4; animation: flow 2s linear infinite; stroke: #d4af37; }
    .path-standard { stroke: #222; }

    #tooltip { position: fixed; pointer-events: none; background: #111; color: #fff; padding: 5px 10px; border-radius: 4px; font-size: 12px; opacity: 0; z-index: 1000; border: 1px solid #333; }
    #tooltip.on { opacity: 1; }
  </style>
</head>
<body>

<div id="map-wrap"><svg id="map"><g id="world"></g></svg></div>

<div id="sidebar">
  <div id="sidebar-head">
    <h2 style="font-size:12px; color:#666; letter-spacing:2px;">PROGRESSION</h2>
    <div id="prog-track"><div id="prog-fill"></div></div>
    <div id="prog-text" style="font-size:10px; color:#444;">0 / 0 mastered</div>
  </div>
  <div id="panel">
    <div id="panel-content">
      <img id="panel-img" src="">
      <h1 id="panel-name" style="font-size:16px; text-align:center; margin-bottom:10px; color:#fff;"></h1>
      <button id="panel-master-btn" style="width:100%; padding:10px; background:none; border:1px solid #444; color:#aaa; cursor:pointer;">MARK MASTERED</button>
    </div>
  </div>
</div>

<div id="tooltip"></div>

<script>
async function main() {
  const svg = document.getElementById('map'), world = document.getElementById('world'), tooltip = document.getElementById('tooltip');
  let data = await (await fetch('graph.json')).json();
  const nodes = data.nodes.map(n => ({...n, id: String(n.id)})), links = data.links.map(l => ({...l, source: String(l.source), target: String(l.target)}));
  
  // Logic Setup
  const gs = new Map(nodes.map(n => [n.id, 'locked']));
  const adj = new Map(nodes.map(n => [n.id, []]));
  links.forEach(l => { adj.get(l.source).push(l.target); adj.get(l.target).push(l.source); });
  
  const depth = new Map(), queue = [];
  nodes.filter(n => n.start).forEach(n => { depth.set(n.id, 0); queue.push(n.id); });
  for(let i=0; i<queue.length; i++){
    adj.get(queue[i]).forEach(nb => { if(!depth.has(nb)){ depth.set(nb, depth.get(queue[i])+1); queue.push(nb); }});
  }

  // Load State
  const saved = localStorage.getItem('von_state');
  if(saved) Object.entries(JSON.parse(saved)).forEach(([k,v]) => gs.set(k,v));
  else nodes.forEach(n => { if(n.start) gs.set(n.id, 'mastered'); else if(depth.get(n.id) === 1) gs.set(n.id, 'unlocked'); });

  const R = 35;
  const els = new Map();

  // Render
  nodes.forEach(n => {
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('transform', `translate(${n.x},${n.y})`);
    
    // Halo (Terminal/Teaser)
    const halo = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    halo.setAttribute('r', R + 10); halo.setAttribute('fill', 'none'); halo.setAttribute('class', 'halo');
    g.appendChild(halo);

    // Image
    const img = document.createElementNS('http://www.w3.org/2000/svg', 'image');
    img.setAttribute('href', n.image); img.setAttribute('x', -R); img.setAttribute('y', -R);
    img.setAttribute('width', R*2); img.setAttribute('height', R*2); img.setAttribute('clip-path', 'circle(50%)');
    g.appendChild(img);

    // Hitbox
    const hit = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    hit.setAttribute('r', R); hit.setAttribute('fill', 'transparent'); hit.setAttribute('stroke', '#333');
    g.appendChild(hit);

    world.appendChild(g);
    els.set(n.id, {g, hit, halo, img});
    g.onclick = () => selectNode(n.id);
  });

  function update() {
    nodes.forEach(n => {
      const e = els.get(n.id);
      const state = gs.get(n.id);
      const isTeaser = state === 'locked' && adj.get(n.id).some(nb => gs.get(nb) === 'mastered');
      const isTerminal = adj.get(n.id).every(nb => depth.get(nb) < depth.get(n.id));

      // Visibility
      e.g.style.display = (state === 'locked' && !isTeaser) ? 'none' : 'block';
      
      // Styling
      e.hit.setAttribute('stroke', state === 'mastered' ? '#d4af37' : (isTeaser ? '#555' : '#333'));
      e.hit.setAttribute('stroke-width', state === 'mastered' ? '3' : '1');
      e.img.style.filter = state === 'mastered' ? 'none' : (isTeaser ? 'grayscale(1) brightness(0.5)' : 'grayscale(1)');
      
      // Halo logic
      e.halo.style.display = (isTerminal || isTeaser) ? 'block' : 'none';
      e.halo.setAttribute('stroke', isTeaser ? '#444' : '#d4af37');
      e.halo.setAttribute('stroke-dasharray', isTeaser ? '4 4' : 'none');
    });
  }

  function selectNode(id) {
    const btn = document.getElementById('panel-master-btn');
    document.getElementById('panel-content').style.display = 'flex';
    document.getElementById('panel-name').textContent = nodes.find(n => n.id === id).text;
    document.getElementById('panel-img').src = nodes.find(n => n.id === id).image;
    
    btn.style.display = gs.get(id) === 'unlocked' ? 'block' : 'none';
    btn.onclick = () => {
      gs.set(id, 'mastered');
      adj.get(id).forEach(nb => { if(gs.get(nb) === 'locked') gs.set(nb, 'unlocked'); });
      localStorage.setItem('von_state', JSON.stringify(Object.fromEntries(gs)));
      update();
      btn.style.display = 'none';
    };
  }

  update();
}
main();
</script>
</body>
</html>
