<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <marker id="arr" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,0.5 4.5,2.5 0,4.5" fill="#1a1714"/>
    </marker>
  </defs>

  <!-- Outer ring -->
  <circle cx="16" cy="16" r="14.5" fill="#faf8f5" stroke="#1a1714" stroke-width="1.5"/>

  <!-- Edge: mastered → unlocked -->
  <line x1="13.4" y1="18.6" x2="18.6" y2="13.4"
        stroke="#1a1714" stroke-width="2" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- Mastered node — bottom-left, gold filled -->
  <circle cx="10" cy="22" r="4.8" fill="#b8860b"/>

  <!-- Unlocked node — top-right, ring only -->
  <circle cx="22" cy="10" r="4.8" fill="#faf8f5" stroke="#6a6258" stroke-width="1.5"/>
</svg>
